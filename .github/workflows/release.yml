name: Validate mod catalog

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source packs
        shell: pwsh
        run: ./scripts/validate-source-packs.ps1
      - name: Validate release assets
        shell: pwsh
        run: ./scripts/validate-release-assets.ps1
